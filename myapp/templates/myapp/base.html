<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Programas{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; color: #222; }
        header { background: #1f3a5f; color: #fff; padding: 16px 24px; }
        header a { color: #fff; margin-right: 16px; text-decoration: none; }
        main { max-width: 800px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        form p { margin: 12px 0; }
        label { display: inline-block; min-width: 90px; font-weight: bold; }
        input[type=text] { padding: 6px; width: 60%; }
        button { background: #1f3a5f; color: #fff; border: 0; padding: 8px 18px; border-radius: 4px; cursor: pointer; }
        .ok { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; }
        .errorlist { color: #b00020; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'crear_programa' %}">Crear programa</a>
        <a href="/admin/">Administrador</a>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}<p class="ok">{{ message }}</p>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
